<div class="login-page">
  <div class="login-container">
    <div class="login-card">
      <div class="logo"><img src="/logo.png"></div>

      <div class="login-header">
        <h1>Bentornato</h1>
        <p>Accedi al tuo account per continuare</p>
      </div>

      <form class="login-form" (ngSubmit)="login()">
        <div class="form-group">
          <label for="email">Email</label>
          <div class="input-wrapper">
            <span class="input-icon">
              <i class="bi bi-envelope"></i>
            </span>
            <input
              type="email"
              id="email"
              name="email"
              [(ngModel)]="email"
              placeholder="tuo@email.com"
              required
            >
          </div>
        </div>

        <div class="form-group">
          <label for="password">Password</label>
          <div class="input-wrapper">
            <span class="input-icon">
              <i class="bi bi-lock"></i>
            </span>
            <input
              [type]="showPassword ? 'text' : 'password'"
              id="password"
              name="password"
              [(ngModel)]="password"
              placeholder="••••••••"
              required
            >

            <button
              type="button"
              class="password-toggle"
              (click)="togglePassword()"
              [attr.aria-label]="showPassword ? 'Nascondi password' : 'Mostra password'">
              <i class="bi" [class.bi-eye]="!showPassword" [class.bi-eye-slash]="showPassword"></i>
            </button>
          </div>
        </div>

        @if (errorMessage) {
          <div class="error-message">
            {{ errorMessage }}
          </div>
        }

        <button type="submit" class="btn-login">
          Accedi
        </button>
      </form>

      <div class="login-footer">
        <p>Non hai un account? <a href="#" class="link-register" routerLink="/register">Registrati</a></p>
      </div>
    </div>

    <div class="back-home">
      <a class="link-back" routerLink="">← Torna alla Home</a>
    </div>
  </div>
</div>
