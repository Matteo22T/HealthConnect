<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Navbar Component</title>
</head>
<body>

<header>
  <a class="logo" routerLink="/medico">
    <img src="/logo.png">
    <h3>HealthConnect</h3>
  </a>
  <div class="header-right">
    <nav class="nav-links">
      <a routerLink="/admin/utenti" routerLinkActive="active-link">
        <i class="bi bi-people"></i> Utenti
      </a>
    </nav>
    <div class="profile-container">
      <button (click)="logout()" class="dropdown-item text-danger">
        <i class="bi bi-box-arrow-right"></i> Esci
      </button>
    </div>
  </div>
</header>

</body>
</html>
