<div class="card">
  <div class="card-header">
    <h2>Ultimi Utenti Iscritti</h2>
    <a class="view-all" *ngIf="utenti.length > 0" routerLink="/admin/utenti">
      Vedi tutti <i class="bi bi-arrow-right"></i>
    </a>
  </div>

  <div *ngIf="utenti.length > 0" class="table-responsive">
    <table class="admin-table">
      <thead>
      <tr>
        <th>Utente</th>
        <th>Email</th>
        <th>Ruolo</th>
        <th>Data Iscrizione</th>
        <th>Stato</th>
      </tr>
      </thead>
      <tbody>
      <tr *ngFor="let ut of utenti" class="row-item">
        <td>
          <div class="user-cell">
            <div class="avatar">{{ ut.nome.charAt(0).toUpperCase() }}</div>
            <span class="name">{{ ut.nome }} {{ ut.cognome }}</span>
          </div>
        </td>

        <td><span class="email">{{ ut.email }}</span></td>

        <td>
            <span class="badge" [ngClass]="{ medico: ut.ruolo === 'MEDICO', paziente: ut.ruolo === 'PAZIENTE' }">
              {{ ut.ruolo }}
            </span>
        </td>

        <td>{{ ut.dataCreazione | date:'dd/MM/yyyy' }}</td>

        <td>
            <span class="status" [ngClass]="{ active: ut.stato_approvazione === 'APPROVATO', pending: ut.stato_approvazione === 'PENDING', reject: ut.stato_approvazione === 'RIFIUTATO' }">
              {{ ut.stato_approvazione }}
            </span>
        </td>
      </tr>
      </tbody>
    </table>
  </div>

  <div class="empty-state" *ngIf="utenti.length === 0">
    <div class="empty-icon"><i class="bi bi-people"></i></div>
    <p>Non esistono utenti registrati.</p>
  </div>
</div>
