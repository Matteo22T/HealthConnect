<div class="container fade-in">
  <h1 class="page-title"><i class="bi bi-gear-fill"></i> Impostazioni Account</h1>

  <div class="settings-grid">

    <div class="card">
      <div class="card-header">
        <h2><i class="bi bi-shield-lock"></i> Sicurezza</h2>
      </div>
      <div class="card-body">
        <form [formGroup]="cambiaPasswordForm" (ngSubmit)="cambiaPassword()">
          <button type="submit" class="btn btn-primary" [disabled]="loading || cambiaPasswordForm.invalid">
            <span *ngIf="!loading">Aggiorna Password</span>
            <span *ngIf="loading">Caricamento...</span>
          </button>
        </form>
      </div>
    </div>

    <div class="card">
      <div class="card-header">
        <h2><i class="bi bi-bell"></i> Notifiche</h2>
      </div>
      <div class="card-body">
        <div class="toggle-item">
          <div class="toggle-info">
            <h4>Notifiche Email</h4>
            <p>Ricevi aggiornamenti via email per i tuoi appuntamenti.</p>
          </div>
          <label class="switch">
            <input type="checkbox"
                   [(ngModel)]="impostazioni.notificheEmail"
                   (change)="salvaPreferenze()">
            <span class="slider round"></span>
          </label>
        </div>
      </div>
    </div>

  </div>
</div>
