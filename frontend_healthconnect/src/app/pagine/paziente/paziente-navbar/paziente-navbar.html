<header>
  <a class="logo" routerLink="/paziente/dashboard">
    <img src="/logo.png"> <h3>HealthConnect</h3>
  </a>

  <div class="header-right">
    <nav class="nav-links">
      <a routerLink="/paziente/calendario" routerLinkActive="active-link">
        <i class="bi bi-calendar-event"></i> Calendario
      </a>
      <a routerLink="/paziente/medici" routerLinkActive="active-link">
        <i class="bi bi-people"></i> Medici
      </a>
      <a routerLink="/paziente/cartella" routerLinkActive="active-link">
        <i class="bi bi-clipboard2-data"></i> Cartella Clinica
      </a>
      <a routerLink="/paziente/chat" routerLinkActive="active-link">
        <i class="bi bi-chat-dots"></i> Chat
      </a>
      <a routerLink="/paziente/ai" routerLinkActive="active-link">
        <i class="bi bi-robot"></i> Assistente AI
      </a>
    </nav>

    <div class="hamburger-menu" (click)="toggleMobileMenu()" [class.open]="isMobileMenuOpen">
      <div class="hamburger-line"></div>
      <div class="hamburger-line"></div>
      <div class="hamburger-line"></div>
    </div>

    <div class="profile-container">
      <div class="user-profile" (click)="toggleProfileMenu()">
        <div class="user-avatar">
          {{nomePaziente.trim().charAt(0).toUpperCase() + cognomePaziente.trim().charAt(0).toUpperCase()}}
        </div>
        <div class="user-info">
          <span class="user-name">{{ nomePaziente + " " + cognomePaziente}}</span>
        </div>
        <i class="bi bi-chevron-down dropdown-arrow"></i>
      </div>

      <div class="custom-dropdown shadow" *ngIf="isProfileMenuOpen">
        <a routerLink="/paziente/profilo" (click)="closeProfileMenu()" class="dropdown-item">
          <i class="bi bi-person"></i> Il mio Profilo
        </a>
        <a routerLink="/paziente/impostazioni" (click)="closeProfileMenu()" class="dropdown-item">
          <i class="bi bi-gear"></i> Impostazioni
        </a>
        <div class="dropdown-divider"></div>
        <button (click)="logout()" class="dropdown-item text-danger">
          <i class="bi bi-box-arrow-right"></i> Esci
        </button>
      </div>
    </div>
  </div>

  <nav class="mobile-nav" [class.open]="isMobileMenuOpen">
    <a routerLink="/paziente/calendario" routerLinkActive="active-link" (click)="closeMobileMenu()">
      <i class="bi bi-calendar-event"></i> Calendario
    </a>
    <a routerLink="/paziente/medici" routerLinkActive="active-link" (click)="closeMobileMenu()">
      <i class="bi bi-people"></i> Medici
    </a>
    <a routerLink="/paziente/cartella" routerLinkActive="active-link" (click)="closeMobileMenu()">
      <i class="bi bi-clipboard2-data"></i> Cartella Clinica
    </a>
    <a routerLink="/paziente/chat" routerLinkActive="active-link" (click)="closeMobileMenu()">
      <i class="bi bi-chat-dots"></i> Chat
    </a>
    <a routerLink="/paziente/ai" routerLinkActive="active-link" (click)="closeMobileMenu()">
      <i class="bi bi-robot"></i> Assistente AI
    </a>
  </nav>

  <div class="dropdown-overlay" *ngIf="isProfileMenuOpen || isMobileMenuOpen"
       (click)="closeAllMenus()"></div>
</header>
