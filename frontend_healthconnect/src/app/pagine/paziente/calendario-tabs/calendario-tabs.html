<div class="container">
  <div class="title-section">
    <h1 class="title">Calendario</h1>
  </div>

  <div class="tabs-nav">
    <button [class.active]="activeTab === 'calendario'" (click)="setTab('calendario')">
      <i class="bi bi-calendar-month"></i> Calendario
    </button>
    <button [class.active]="activeTab === 'lista'" (click)="setTab('lista')">
      <i class="bi bi-list-check"></i> Lista Prenotazioni e Visite
    </button>
  </div>

  <div class="tab-content">

    <app-calendario-paziente *ngIf="activeTab === 'calendario'" ></app-calendario-paziente>

    <app-lista-calendario-paziente *ngIf="activeTab === 'lista'"></app-lista-calendario-paziente>

  </div>
</div>
