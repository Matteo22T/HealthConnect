<div class="container">
  <div class="title-section">
    <h1 class="title">I miei pazienti</h1>
    <p class="patient-number">({{pazienti.length}})</p>
  </div>

  <div class="table-section">

    <div class="search-container">
      <span class="search-icon"><i class="bi bi-search"></i></span>
      <input
        type="text"
        placeholder="Cerca per nome o cognome..."
        [(ngModel)]="campoRicerca"
        (input)="ricercaPazienti()"
        class="search-bar"
      >
    </div>

    <div class="patient-list-container">

      <div *ngIf="pazientiFiltrati.length === 0" class="no-results">
        Nessun paziente trovato.
      </div>

      <div
        *ngFor="let paz of pazientiFiltrati"
        class="patient-row"
        (click)="apriProfilo(paz)"
      >

        <div class="row-left">
          <div class="avatar-circle">
            {{ paz.nome ? paz.nome[0].toUpperCase() : '' }}{{ paz.cognome ? paz.cognome[0].toUpperCase() : '' }}
          </div>

          <div class="patient-info">
            <div class="full-name">{{ paz.nome }} {{ paz.cognome }}</div>
            <div class="sub-details">
              <span class="detail-item">
                <i class="bi bi-calendar3"></i> {{ paz.dataNascita | date:'dd/MM/yyyy' }}
              </span>
              <span class="detail-item separator">•</span>
              <span class="detail-item">
                <i class="bi bi-gender-ambiguous"></i> Sesso: {{ paz.sesso }}
              </span>
            </div>
          </div>
        </div>

        <div class="row-right">
          <a
            class="btn-message link-style"
            (click)="$event.stopPropagation(); apriChatPaziente(paz.id)"
          >
            <i class="bi bi-chat-dots-fill"></i> Invia Messaggio
          </a>
        </div>
      </div>
    </div>
  </div>
</div>
