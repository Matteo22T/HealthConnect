<main class="container">
  <div *ngIf="erroreMessage" class="error-alert">
    <i class="bi bi-exclamation-triangle-fill"></i>
    <span>{{ erroreMessage }}</span>
    <button (click)="erroreMessage = ''" class="close-btn">
      <i class="bi bi-x"></i>
    </button>
  </div>

  <div class="welcome-section">
    <h1 class="title">Bentornato, Dott. {{cognomeMedico}}</h1>
    <p>Ecco una panoramica della tua giornata</p>
  </div>

  <div class="dashboard-grid">
    <app-stat-card
      tipo="pending"
      icona="bi bi-hourglass-split"
      etichetta="In attesa"
      [contatore]="prenotazioni.length"
      (cardClick)="scrollToSection($event)">
    </app-stat-card>

    <app-stat-card
      tipo="today"
      icona="bi bi-clipboard2-check"
      etichetta="Visite oggi"
      [contatore]="visite.length"
      (cardClick)="scrollToSection($event)">
    </app-stat-card>

    <app-stat-card
      tipo="patients"
      icona="bi bi-people"
      etichetta="Pazienti"
      [contatore]="numeroPazienti"
      (cardClick)="scrollToSection($event)">
    </app-stat-card>

    <app-stat-card
      tipo="messages"
      icona="bi bi-chat-dots"
      etichetta="Messaggi"
      [contatore]="messaggi.length"
      (cardClick)="scrollToSection($event)">
    </app-stat-card>
  </div>

  <div class="main-grid">
    <app-lista-visita id="today" [prossimeVisite]="visite"></app-lista-visita>

    <app-lista-richiesta
      id="pending"
      [prenotazioniInAttesa]="prenotazioni"
      (accettaPrenotazione)="gestisciAccettazionePrenotazione($event)"
      (rifiutaPrenotazione)="gestisciRifiutoPrenotazione($event)">
    </app-lista-richiesta>

    <app-messaggi id="messages" [ultimiMessaggi]="messaggi"></app-messaggi>

    <app-pazienti-senza-diagnosi
      id="patients"
      [visite]="VisiteSenzaDiagnosi"
      (apriVisita)="apriVisitaSpecifica($event)">
    </app-pazienti-senza-diagnosi>
  </div>
</main>
